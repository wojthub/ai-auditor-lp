<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 582" width="640" height="582" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Jak naprawić kanibalizację słów kluczowych?</title>
<desc id="d">Dwie strony rankują na jedną frazę. Jeśli odpowiadają na różne pytania, rozdziel intencje. Jeśli na to samo i słabsza strona ma wartościową treść lub linki, scal treści i przekieruj adres 301. Jeśli obie muszą zostać, ustaw rel canonical. W pozostałych przypadkach przekieruj słabszy adres 301.</desc>
<rect width="640" height="582" fill="#ffffff"/>
<text x="24" y="40" font-size="21" font-weight="700" fill="#0d0d12">Jak naprawić kanibalizację słów kluczowych?</text><text x="24" y="66" font-size="14" fill="#666d80">Drzewo decyzji dla dwóch stron serwisu rankujących na jedną frazę</text><rect x="24" y="88" width="330" height="46" rx="12" fill="#0d0d12"/><text x="42" y="117" font-size="15" font-weight="600" fill="#ffffff">Dwie strony rankują na jedną frazę</text><path d="M64,138 V166 M58,159 L64,167 L70,159" stroke="#8b93a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="172" width="330" height="70" rx="12" fill="#f8fafb" stroke="#0b7983" stroke-width="1.5"/><text x="42" y="202" font-size="15" font-weight="600" fill="#0d0d12">Czy odpowiadają na to</text><text x="42" y="223" font-size="15" font-weight="600" fill="#0d0d12">samo pytanie?</text><path d="M360,207 H392 M385,201 L393,207 L385,213" stroke="#0b7983" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="377" y="199" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b7983">nie</text><rect x="400" y="166.5" width="216" height="81" rx="10" fill="#e6f4f5"/><text x="414" y="191.5" font-size="14" font-weight="600" fill="#0d0d12">Rozdziel intencje -</text><text x="414" y="210.5" font-size="14" font-weight="600" fill="#0d0d12">nowe frazy, tytuły</text><text x="414" y="229.5" font-size="14" font-weight="600" fill="#0d0d12">i nagłówki</text><path d="M64,246 V274 M58,267 L64,275 L70,267" stroke="#8b93a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="266" font-size="12.5" font-weight="600" fill="#8b93a3">tak</text><rect x="24" y="280" width="330" height="70" rx="12" fill="#f8fafb" stroke="#0b7983" stroke-width="1.5"/><text x="42" y="310" font-size="15" font-weight="600" fill="#0d0d12">Czy słabsza strona ma wartościową</text><text x="42" y="331" font-size="15" font-weight="600" fill="#0d0d12">treść lub linki?</text><path d="M360,315 H392 M385,309 L393,315 L385,321" stroke="#0b7983" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="377" y="307" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b7983">tak</text><rect x="400" y="284" width="216" height="62" rx="10" fill="#e6f4f5"/><text x="414" y="309" font-size="14" font-weight="600" fill="#0d0d12">Scal treści i przekieruj</text><text x="414" y="328" font-size="14" font-weight="600" fill="#0d0d12">słabszy adres 301</text><path d="M64,354 V382 M58,375 L64,383 L70,375" stroke="#8b93a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="374" font-size="12.5" font-weight="600" fill="#8b93a3">nie</text><rect x="24" y="388" width="330" height="70" rx="12" fill="#f8fafb" stroke="#0b7983" stroke-width="1.5"/><text x="42" y="418" font-size="15" font-weight="600" fill="#0d0d12">Czy obie strony muszą zostać</text><text x="42" y="439" font-size="15" font-weight="600" fill="#0d0d12">(np. warianty produktu)?</text><path d="M360,423 H392 M385,417 L393,423 L385,429" stroke="#0b7983" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="377" y="415" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b7983">tak</text><rect x="400" y="392" width="216" height="62" rx="10" fill="#e6f4f5"/><text x="414" y="417" font-size="14" font-weight="600" fill="#0d0d12">Ustaw rel=&quot;canonical&quot;</text><text x="414" y="436" font-size="14" font-weight="600" fill="#0d0d12">na stronę docelową</text><path d="M64,462 V490 M58,483 L64,491 L70,483" stroke="#8b93a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="482" font-size="12.5" font-weight="600" fill="#8b93a3">nie</text><rect x="24" y="496" width="330" height="46" rx="12" fill="#0b7983"/><text x="42" y="525" font-size="15" font-weight="600" fill="#ffffff">Przekieruj słabszy adres 301</text><text x="616" y="566" text-anchor="end" font-size="13" font-weight="600" fill="#0b7983">CitationOne</text>
</svg>
