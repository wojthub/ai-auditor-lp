<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" width="640" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Co zrobić ze stroną w content pruningu?</title>
<desc id="d">Macierz decyzji content pruning. Duży ruch i wartościowa treść: zostaw. Duży ruch i słaba treść: zaktualizuj. Mały ruch i wartościowa treść: połącz albo zaktualizuj. Mały ruch i słaba treść: usuń albo przekieruj 301, jeśli strona ma linki.</desc>
<rect width="640" height="530" fill="#ffffff"/>
<text x="24" y="40" font-size="21" font-weight="700" fill="#0d0d12">Co zrobić ze stroną w content pruningu?</text><text x="24" y="66" font-size="14" fill="#666d80">Macierz decyzji - ruch i linki strony a wartość jej treści</text><rect x="92" y="96" width="256" height="170" rx="14" fill="#a8d5d9"/><text x="112" y="140" font-size="19" font-weight="700" fill="#0d0d12">Zaktualizuj</text><text x="112" y="172" font-size="14.5" fill="#36394a">ruch jest, ale treść</text><text x="112" y="193" font-size="14.5" fill="#36394a">się zestarzała</text><rect x="356" y="96" width="256" height="170" rx="14" fill="#0b7983"/><text x="376" y="140" font-size="19" font-weight="700" fill="#ffffff">Zostaw</text><text x="376" y="172" font-size="14.5" fill="#e6f4f5">działa - drobne</text><text x="376" y="193" font-size="14.5" fill="#e6f4f5">poprawki wystarczą</text><rect x="92" y="274" width="256" height="170" rx="14" fill="#fbe3d6"/><text x="112" y="318" font-size="19" font-weight="700" fill="#0d0d12">Usuń albo 301</text><text x="112" y="350" font-size="14.5" fill="#36394a">301, jeśli ma linki,</text><text x="112" y="371" font-size="14.5" fill="#36394a">inaczej 404 lub 410</text><rect x="356" y="274" width="256" height="170" rx="14" fill="#e6f4f5"/><text x="376" y="318" font-size="19" font-weight="700" fill="#0d0d12">Połącz albo zaktualizuj</text><text x="376" y="350" font-size="14.5" fill="#36394a">scal z silniejszą stroną</text><text x="376" y="371" font-size="14.5" fill="#36394a">albo dopisz brakujące</text><text x="68" y="181" text-anchor="middle" transform="rotate(-90 68 181)" font-size="13.5" font-weight="600" fill="#666d80">duży ruch</text><text x="68" y="359" text-anchor="middle" transform="rotate(-90 68 359)" font-size="13.5" font-weight="600" fill="#666d80">mały ruch</text><text x="38" y="270" text-anchor="middle" transform="rotate(-90 38 270)" font-size="12" font-weight="700" fill="#818898">RUCH I LINKI</text><text x="220" y="470" text-anchor="middle" font-size="13.5" font-weight="600" fill="#666d80">słaba lub nieaktualna</text><text x="484" y="470" text-anchor="middle" font-size="13.5" font-weight="600" fill="#666d80">wartościowa</text><text x="352" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#818898">WARTOŚĆ TREŚCI</text><text x="616" y="514" text-anchor="end" font-size="13" font-weight="600" fill="#0b7983">CitationOne</text>
</svg>
