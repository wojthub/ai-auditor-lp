<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Jak linkować strony w klastrze tematycznym?</title>
<desc id="d">Schemat linkowania w klastrze tematycznym. Strona główna tematu w środku linkuje do czterech stron szczegółowych, a każda strona szczegółowa linkuje z powrotem do strony głównej. Dwie strony szczegółowe, które rozwijają ten sam wątek, linkują też do siebie. Jeden link z klastra prowadzi do strony oferty.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b7983"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#818898"/></marker>
</defs>
<rect width="640" height="520" fill="#ffffff"/>
<text x="24" y="40" font-size="21" font-weight="700" fill="#0d0d12">Jak linkować strony w klastrze tematycznym?</text>
<text x="24" y="66" font-size="14" fill="#666d80">Strona główna tematu, strony szczegółowe i kierunki linków</text>
