<text x="320" y="126" text-anchor="middle" font-size="13" fill="#666d80">gdy treść się łączy</text>
<line x1="180" y1="170" x2="248" y2="228" stroke="#0b7983" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="460" y1="170" x2="392" y2="228" stroke="#0b7983" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="180" y1="378" x2="248" y2="308" stroke="#0b7983" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="460" y1="378" x2="392" y2="308" stroke="#0b7983" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="320" y1="308" x2="320" y2="452" stroke="#0b7983" stroke-width="2" marker-end="url(#a)"/>
<text x="332" y="386" font-size="13" fill="#666d80">link do konwersji</text>
<text x="24" y="214" font-size="13" fill="#666d80">linki w obie strony</text>
<rect x="24" y="104" width="180" height="64" rx="12" fill="#e6f4f5"/>
