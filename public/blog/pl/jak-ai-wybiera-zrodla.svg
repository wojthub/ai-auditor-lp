<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Jak systemy AI wybierają źródła odpowiedzi?</title>
<desc id="d">Trzy etapy: 1. wyszukiwanie w indeksie, także na pytania poboczne (warunek: strona w indeksie i dostępna dla robota), 2. wybór fragmentów odpowiadających na pytanie (warunek: sekcja zrozumiała po wycięciu), 3. synteza odpowiedzi z linkami do źródeł (efekt: cytowanie).</desc>
<rect width="640" height="560" fill="#ffffff"/>
<text x="24" y="40" font-size="21" font-weight="700" fill="#0d0d12">Jak systemy AI wybierają źródła odpowiedzi?</text><text x="24" y="66" font-size="14" fill="#666d80">Trzy etapy w asystencie AI z dostępem do internetu</text><rect x="24" y="92" width="592" height="118" rx="12" fill="#f8fafb" stroke="#dfe1e7"/><circle cx="62" cy="128" r="17" fill="#0b7983"/><text x="62" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text><text x="94" y="126" font-size="18" font-weight="700" fill="#0d0d12">Wyszukiwanie</text><text x="94" y="150" font-size="14.5" fill="#666d80">Zapytania do indeksu wyszukiwarki, także na pytania</text>
<text x="94" y="169" font-size="14.5" fill="#666d80">poboczne (query fan-out)</text><text x="94" y="196" font-size="13.5" font-weight="600" fill="#0b7983">Warunek: strona w indeksie i dostępna dla robota</text><path d="M62,216 V236 M55,229 L62,237 L69,229" stroke="#8b93a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="244" width="592" height="118" rx="12" fill="#f8fafb" stroke="#dfe1e7"/><circle cx="62" cy="280" r="17" fill="#0b7983"/><text x="62" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text><text x="94" y="278" font-size="18" font-weight="700" fill="#0d0d12">Wybór fragmentów</text><text x="94" y="302" font-size="14.5" fill="#666d80">Akapity, tabele i listy, które odpowiadają</text>
<text x="94" y="321" font-size="14.5" fill="#666d80">na pytanie lub jego część</text><text x="94" y="348" font-size="13.5" font-weight="600" fill="#0b7983">Warunek: sekcja zrozumiała po wycięciu z tekstu</text><path d="M62,368 V388 M55,381 L62,389 L69,381" stroke="#8b93a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="396" width="592" height="118" rx="12" fill="#f8fafb" stroke="#dfe1e7"/><circle cx="62" cy="432" r="17" fill="#0b7983"/><text x="62" y="438" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text><text x="94" y="430" font-size="18" font-weight="700" fill="#0d0d12">Synteza odpowiedzi</text><text x="94" y="454" font-size="14.5" fill="#666d80">Odpowiedź napisana z wybranych fragmentów</text>
<text x="94" y="473" font-size="14.5" fill="#666d80">z linkami do stron źródłowych</text><text x="94" y="500" font-size="13.5" font-weight="600" fill="#0b7983">Efekt: cytowanie i link do Twojej strony</text>
<text x="616" y="544" text-anchor="end" font-size="13" font-weight="600" fill="#0b7983">CitationOne</text>
</svg>
