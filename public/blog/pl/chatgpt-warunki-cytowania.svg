<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Czy ChatGPT może zacytować Twoją stronę?</title>
<desc id="d">Cztery warunki: 1. robots.txt dopuszcza OAI-SearchBot, inaczej strona nie pojawi się w wyszukiwaniu ChatGPT, 2. CDN i firewall przepuszczają adresy IP robota OpenAI, 3. strona jest w indeksie Google i Bing, 4. sekcje odpowiadają wprost z faktami i źródłami. Po spełnieniu warunków strona może zostać zacytowana, ale OpenAI nie gwarantuje miejsca.</desc>
<rect width="640" height="640" fill="#ffffff"/>
<text x="24" y="40" font-size="21" font-weight="700" fill="#0d0d12">Czy ChatGPT może zacytować Twoją stronę?</text><text x="24" y="66" font-size="14" fill="#666d80">Cztery warunki z dokumentacji OpenAI i badań GEO, w kolejności sprawdzania</text><rect x="24" y="92" width="330" height="84" rx="12" fill="#f8fafb" stroke="#dfe1e7"/><circle cx="54" cy="134" r="15" fill="#0b7983"/><text x="54" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text><text x="82" y="128" font-size="15.5" font-weight="600" fill="#0d0d12">robots.txt dopuszcza</text>
<text x="82" y="150" font-size="15.5" font-weight="600" fill="#0d0d12">robota OAI-SearchBot</text><path d="M360,134 H382 M376,128 L383,134 L376,140" stroke="#c8602f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="372" y="126" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c8602f">nie</text><rect x="390" y="98" width="226" height="72" rx="10" fill="#fdf1ea"/><text x="402" y="120" font-size="13.5" fill="#0d0d12">Strona nie pojawi się</text>
<text x="402" y="138" font-size="13.5" fill="#0d0d12">w wynikach wyszukiwania</text>
<text x="402" y="156" font-size="13.5" fill="#0d0d12">ChatGPT</text><path d="M54,180 V200 M48,194 L54,201 L60,194" stroke="#0b7983" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="199" font-size="12.5" font-weight="600" fill="#0b7983">tak</text><rect x="24" y="206" width="330" height="84" rx="12" fill="#f8fafb" stroke="#dfe1e7"/><circle cx="54" cy="248" r="15" fill="#0b7983"/><text x="54" y="254" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text><text x="82" y="242" font-size="15.5" font-weight="600" fill="#0d0d12">CDN i firewall przepuszczają</text>
<text x="82" y="264" font-size="15.5" font-weight="600" fill="#0d0d12">adresy IP robota OpenAI</text><path d="M360,248 H382 M376,242 L383,248 L376,254" stroke="#c8602f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="372" y="240" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c8602f">nie</text><rect x="390" y="221" width="226" height="54" rx="10" fill="#fdf1ea"/><text x="402" y="243" font-size="13.5" fill="#0d0d12">Robot nie pobierze strony</text>
<text x="402" y="261" font-size="13.5" fill="#0d0d12">mimo otwartego robots.txt</text><path d="M54,294 V314 M48,308 L54,315 L60,308" stroke="#0b7983" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="313" font-size="12.5" font-weight="600" fill="#0b7983">tak</text><rect x="24" y="320" width="330" height="84" rx="12" fill="#f8fafb" stroke="#dfe1e7"/><circle cx="54" cy="362" r="15" fill="#0b7983"/><text x="54" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text><text x="82" y="356" font-size="15.5" font-weight="600" fill="#0d0d12">Strona jest w indeksie</text>
<text x="82" y="378" font-size="15.5" font-weight="600" fill="#0d0d12">Google i Bing</text><path d="M360,362 H382 M376,356 L383,362 L376,368" stroke="#c8602f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="372" y="354" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c8602f">nie</text><rect x="390" y="335" width="226" height="54" rx="10" fill="#fdf1ea"/><text x="402" y="357" font-size="13.5" fill="#0d0d12">Małe szanse, że ChatGPT</text>
<text x="402" y="375" font-size="13.5" fill="#0d0d12">trafi na stronę</text><path d="M54,408 V428 M48,422 L54,429 L60,422" stroke="#0b7983" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="427" font-size="12.5" font-weight="600" fill="#0b7983">tak</text><rect x="24" y="434" width="330" height="84" rx="12" fill="#f8fafb" stroke="#dfe1e7"/><circle cx="54" cy="476" r="15" fill="#0b7983"/><text x="54" y="482" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text><text x="82" y="470" font-size="15.5" font-weight="600" fill="#0d0d12">Sekcje odpowiadają wprost,</text>
<text x="82" y="492" font-size="15.5" font-weight="600" fill="#0d0d12">z faktami i źródłami</text><path d="M360,476 H382 M376,470 L383,476 L376,482" stroke="#c8602f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="372" y="468" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c8602f">nie</text><rect x="390" y="449" width="226" height="54" rx="10" fill="#fdf1ea"/><text x="402" y="471" font-size="13.5" fill="#0d0d12">ChatGPT częściej wybierze</text>
<text x="402" y="489" font-size="13.5" fill="#0d0d12">fragment konkurencji</text><path d="M54,522 V542 M48,536 L54,543 L60,536" stroke="#0b7983" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="541" font-size="12.5" font-weight="600" fill="#0b7983">tak</text><rect x="24" y="548" width="330" height="56" rx="12" fill="#0b7983"/><text x="44" y="572" font-size="14.5" font-weight="600" fill="#ffffff">Strona może zostać zacytowana</text>
<text x="44" y="592" font-size="14.5" font-weight="600" fill="#ffffff">(OpenAI nie gwarantuje miejsca)</text>
<text x="616" y="624" text-anchor="end" font-size="13" font-weight="600" fill="#0b7983">CitationOne</text>
</svg>
