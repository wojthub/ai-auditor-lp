<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" width="640" height="530" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">What should you do with a page in content pruning?</title>
<desc id="d">Content pruning decision matrix. High traffic and valuable content, keep. High traffic and weak content, update. Low traffic and valuable content, merge or update. Low traffic and weak content, delete, or 301 redirect if the page has links.</desc>
<rect width="640" height="530" fill="#ffffff"/>
<text x="24" y="40" font-size="21" font-weight="700" fill="#0d0d12">What should you do with a page in content pruning?</text><text x="24" y="66" font-size="14" fill="#666d80">Decision matrix, page traffic and links vs content value</text><rect x="92" y="96" width="256" height="170" rx="14" fill="#a8d5d9"/><text x="112" y="140" font-size="19" font-weight="700" fill="#0d0d12">Update</text><text x="112" y="172" font-size="14.5" fill="#36394a">traffic is there, but</text><text x="112" y="193" font-size="14.5" fill="#36394a">the content has aged</text><rect x="356" y="96" width="256" height="170" rx="14" fill="#0b7983"/><text x="376" y="140" font-size="19" font-weight="700" fill="#ffffff">Keep</text><text x="376" y="172" font-size="14.5" fill="#e6f4f5">it works, minor</text><text x="376" y="193" font-size="14.5" fill="#e6f4f5">fixes are enough</text><rect x="92" y="274" width="256" height="170" rx="14" fill="#fbe3d6"/><text x="112" y="318" font-size="19" font-weight="700" fill="#0d0d12">Delete or 301</text><text x="112" y="350" font-size="14.5" fill="#36394a">301 if it has links,</text><text x="112" y="371" font-size="14.5" fill="#36394a">otherwise 404 or 410</text><rect x="356" y="274" width="256" height="170" rx="14" fill="#e6f4f5"/><text x="376" y="318" font-size="19" font-weight="700" fill="#0d0d12">Merge or update</text><text x="376" y="350" font-size="14.5" fill="#36394a">merge with a stronger page</text><text x="376" y="371" font-size="14.5" fill="#36394a">or add what is missing</text><text x="68" y="181" text-anchor="middle" transform="rotate(-90 68 181)" font-size="13.5" font-weight="600" fill="#666d80">high traffic</text><text x="68" y="359" text-anchor="middle" transform="rotate(-90 68 359)" font-size="13.5" font-weight="600" fill="#666d80">low traffic</text><text x="38" y="270" text-anchor="middle" transform="rotate(-90 38 270)" font-size="12" font-weight="700" fill="#818898">TRAFFIC AND LINKS</text><text x="220" y="470" text-anchor="middle" font-size="13.5" font-weight="600" fill="#666d80">weak or outdated</text><text x="484" y="470" text-anchor="middle" font-size="13.5" font-weight="600" fill="#666d80">valuable</text><text x="352" y="494" text-anchor="middle" font-size="12" font-weight="700" fill="#818898">CONTENT VALUE</text><text x="616" y="514" text-anchor="end" font-size="13" font-weight="600" fill="#0b7983">CitationOne</text>
</svg>
