<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" width="640" height="285" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">When should you change the date of an updated post?</title>
<desc id="d">CitationOne rule. Below 20% changes the dates stay the same, 20-50% changes mean an update date, more than 50% new content means a new publication date.</desc>
<rect width="640" height="285" fill="#ffffff"/>
<text x="24" y="40" font-size="21" font-weight="700" fill="#0d0d12">When should you change the date of an updated post?</text><text x="24" y="66" font-size="14" fill="#666d80">Share of new or rewritten content, CitationOne rule of thumb</text><path d="M28,112 H141.4 V152 H28 Q24,152 24,148 V116 Q24,112 28,112 Z" fill="#e3e6eb"/><text x="82.7" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#0d0d12">below 20%</text><text x="26" y="186" font-size="14.5" font-weight="700" fill="#0d0d12">Dates unchanged</text><text x="26" y="210" font-size="13.5" fill="#666d80">typos, links,</text>
<text x="26" y="229" font-size="13.5" fill="#666d80">individual numbers</text><path d="M143.4,112 H319 V152 H143.4 Z" fill="#a8d5d9"/><text x="231.2" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#0d0d12">20-50%</text><text x="155.4" y="186" font-size="14.5" font-weight="700" fill="#0d0d12">Update date</text><text x="155.4" y="210" font-size="13.5" fill="#666d80">new data, sections,</text>
<text x="155.4" y="229" font-size="13.5" fill="#666d80">restructuring</text><path d="M321,112 H612 Q616,112 616,116 V148 Q616,152 612,152 H321 Z" fill="#0b7983"/><text x="468.5" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">above 50%</text><text x="333" y="186" font-size="14.5" font-weight="700" fill="#0b7983">New publication date</text><text x="333" y="210" font-size="13.5" fill="#666d80">post largely</text>
<text x="333" y="229" font-size="13.5" fill="#666d80">rewritten</text><text x="24" y="102" text-anchor="start" font-size="12.5" fill="#818898">0%</text><text x="142.4" y="102" text-anchor="middle" font-size="12.5" fill="#818898">20%</text><text x="320" y="102" text-anchor="middle" font-size="12.5" fill="#818898">50%</text><text x="616" y="102" text-anchor="end" font-size="12.5" fill="#818898">100%</text>
<text x="616" y="269" text-anchor="end" font-size="13" font-weight="600" fill="#0b7983">CitationOne</text>
</svg>
