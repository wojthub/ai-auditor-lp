<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">How do AI systems choose their sources?</title>
<desc id="d">Three stages: 1. retrieval from the index, also for follow-up questions (condition: page indexed and open to the crawler), 2. selection of passages that answer the question (condition: section makes sense on its own), 3. synthesis of an answer with links to sources (result: a citation).</desc>
<rect width="640" height="560" fill="#ffffff"/>
<text x="24" y="40" font-size="21" font-weight="700" fill="#0d0d12">How do AI systems choose their sources?</text><text x="24" y="66" font-size="14" fill="#666d80">Three stages in an AI assistant with web access</text><rect x="24" y="92" width="592" height="118" rx="12" fill="#f8fafb" stroke="#dfe1e7"/><circle cx="62" cy="128" r="17" fill="#0b7983"/><text x="62" y="134" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text><text x="94" y="126" font-size="18" font-weight="700" fill="#0d0d12">Retrieval</text><text x="94" y="150" font-size="14.5" fill="#666d80">Queries to a search engine index, also for follow-up</text>
<text x="94" y="169" font-size="14.5" fill="#666d80">questions (query fan-out)</text><text x="94" y="196" font-size="13.5" font-weight="600" fill="#0b7983">Condition: page indexed and open to the crawler</text><path d="M62,216 V236 M55,229 L62,237 L69,229" stroke="#8b93a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="244" width="592" height="118" rx="12" fill="#f8fafb" stroke="#dfe1e7"/><circle cx="62" cy="280" r="17" fill="#0b7983"/><text x="62" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text><text x="94" y="278" font-size="18" font-weight="700" fill="#0d0d12">Passage selection</text><text x="94" y="302" font-size="14.5" fill="#666d80">Paragraphs, tables and lists that answer</text>
<text x="94" y="321" font-size="14.5" fill="#666d80">the question or part of it</text><text x="94" y="348" font-size="13.5" font-weight="600" fill="#0b7983">Condition: section makes sense on its own</text><path d="M62,368 V388 M55,381 L62,389 L69,381" stroke="#8b93a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="396" width="592" height="118" rx="12" fill="#f8fafb" stroke="#dfe1e7"/><circle cx="62" cy="432" r="17" fill="#0b7983"/><text x="62" y="438" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text><text x="94" y="430" font-size="18" font-weight="700" fill="#0d0d12">Answer synthesis</text><text x="94" y="454" font-size="14.5" fill="#666d80">An answer written from the selected passages</text>
<text x="94" y="473" font-size="14.5" fill="#666d80">with links to the source pages</text><text x="94" y="500" font-size="13.5" font-weight="600" fill="#0b7983">Result: a citation and a link to your page</text>
<text x="616" y="544" text-anchor="end" font-size="13" font-weight="600" fill="#0b7983">CitationOne</text>
</svg>
