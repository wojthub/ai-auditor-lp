<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 582" width="640" height="582" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">How do you fix keyword cannibalization?</title>
<desc id="d">Two pages rank for one keyword. If they answer different questions, separate the intents. If they answer the same question and the weaker page has valuable content or links, merge the content and 301 redirect the URL. If both have to stay, set rel canonical. Otherwise, 301 redirect the weaker URL.</desc>
<rect width="640" height="582" fill="#ffffff"/>
<text x="24" y="40" font-size="21" font-weight="700" fill="#0d0d12">How do you fix keyword cannibalization?</text><text x="24" y="66" font-size="14" fill="#666d80">Decision tree for two pages of one site ranking for one keyword</text><rect x="24" y="88" width="330" height="46" rx="12" fill="#0d0d12"/><text x="42" y="117" font-size="15" font-weight="600" fill="#ffffff">Two pages rank for one keyword</text><path d="M64,138 V166 M58,159 L64,167 L70,159" stroke="#8b93a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="172" width="330" height="70" rx="12" fill="#f8fafb" stroke="#0b7983" stroke-width="1.5"/><text x="42" y="202" font-size="15" font-weight="600" fill="#0d0d12">Do they answer the</text><text x="42" y="223" font-size="15" font-weight="600" fill="#0d0d12">same question?</text><path d="M360,207 H392 M385,201 L393,207 L385,213" stroke="#0b7983" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="377" y="199" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b7983">no</text><rect x="400" y="166.5" width="216" height="81" rx="10" fill="#e6f4f5"/><text x="414" y="191.5" font-size="14" font-weight="600" fill="#0d0d12">Separate the intents</text><text x="414" y="210.5" font-size="14" font-weight="600" fill="#0d0d12">with new keywords,</text><text x="414" y="229.5" font-size="14" font-weight="600" fill="#0d0d12">titles and headings</text><path d="M64,246 V274 M58,267 L64,275 L70,267" stroke="#8b93a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="266" font-size="12.5" font-weight="600" fill="#8b93a3">yes</text><rect x="24" y="280" width="330" height="70" rx="12" fill="#f8fafb" stroke="#0b7983" stroke-width="1.5"/><text x="42" y="310" font-size="15" font-weight="600" fill="#0d0d12">Does the weaker page have</text><text x="42" y="331" font-size="15" font-weight="600" fill="#0d0d12">valuable content or links?</text><path d="M360,315 H392 M385,309 L393,315 L385,321" stroke="#0b7983" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="377" y="307" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b7983">yes</text><rect x="400" y="284" width="216" height="62" rx="10" fill="#e6f4f5"/><text x="414" y="309" font-size="14" font-weight="600" fill="#0d0d12">Merge the content and</text><text x="414" y="328" font-size="14" font-weight="600" fill="#0d0d12">redirect the weaker URL 301</text><path d="M64,354 V382 M58,375 L64,383 L70,375" stroke="#8b93a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="374" font-size="12.5" font-weight="600" fill="#8b93a3">no</text><rect x="24" y="388" width="330" height="70" rx="12" fill="#f8fafb" stroke="#0b7983" stroke-width="1.5"/><text x="42" y="418" font-size="15" font-weight="600" fill="#0d0d12">Do both pages have to stay</text><text x="42" y="439" font-size="15" font-weight="600" fill="#0d0d12">(e.g. product variants)?</text><path d="M360,423 H392 M385,417 L393,423 L385,429" stroke="#0b7983" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="377" y="415" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b7983">yes</text><rect x="400" y="392" width="216" height="62" rx="10" fill="#e6f4f5"/><text x="414" y="417" font-size="14" font-weight="600" fill="#0d0d12">Set rel=&quot;canonical&quot;</text><text x="414" y="436" font-size="14" font-weight="600" fill="#0d0d12">to the target page</text><path d="M64,462 V490 M58,483 L64,491 L70,483" stroke="#8b93a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="482" font-size="12.5" font-weight="600" fill="#8b93a3">no</text><rect x="24" y="496" width="330" height="46" rx="12" fill="#0b7983"/><text x="42" y="525" font-size="15" font-weight="600" fill="#ffffff">301 redirect the weaker URL</text><text x="616" y="566" text-anchor="end" font-size="13" font-weight="600" fill="#0b7983">CitationOne</text>
</svg>
